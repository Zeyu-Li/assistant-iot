# Labelled utterances for `assistant eval-router`.
#   expect: the capability id that must be chosen, or "none" for requests the
#           assistant must not act on. Items labelled none may also list
#           `also_ok` ids that are acceptable answers (e.g. chat).
# Keep phrasings out of config/capabilities.yaml's examples so this measures generalisation.

weather:
  - is it going to rain today
  - do I need an umbrella this afternoon
  - what's the forecast for the weekend
  - how hot will it be tomorrow
  - is it cold outside
  - what's the temperature in Boston right now
  - will it snow in Tahoe on Saturday
  - should I bring a jacket tonight
  - weather in Tokyo on Friday
  - is it going to be sunny tomorrow
  - what's the high today
  - any storms coming this week
  - how windy is it going to be
