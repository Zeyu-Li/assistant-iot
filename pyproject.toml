[project]
name = "assistant-iot"
version = "0.1.0"
description = "Local-first voice assistant for Jetson-class devices and up"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["pydantic (>=2.14.4,<3.0.0)", "pyyaml (>=6.0.4,<7.0.0)", "jsonschema (>=4.26.0,<5.0.0)", "httpx (>=0.28.1,<0.29.0)", "playwright (>=1.65.2,<2.0.0)", "mcp (>=2.3.0,<3.0.0)", "keyring (>=25.7.0,<26.0.0)", "google-auth-oauthlib (>=1.5.0,<2.0.0)", "httpx2 (>=2.10,<2.15)", "numpy (>=1.26,<2.3)", "sherpa-onnx (>=1.13.8,<2)", "sounddevice (>=0.5.6,<0.6.0)", "sentencepiece (>=0.2.1,<0.2.3)"]

[project.scripts]
assistant = "assistant.cli:main"

[tool.poetry]
packages = [{ include = "assistant", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
